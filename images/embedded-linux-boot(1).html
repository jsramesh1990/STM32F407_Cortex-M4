<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Linux Boot Sequence</title>
<style>
  :root{
    --bg:#0a0d12;
    --bg-grid:#0d1219;
    --panel:#10151d;
    --panel-border:#1e2731;
    --copper:#c88a52;
    --copper-dim:#3a3126;
    --text-primary:#e7edf2;
    --text-dim:#7c8896;
    --text-faint:#4a5560;
    --amber:#ffb454;
    --cyan:#5ad1e6;
    --blue:#6c93ff;
    --violet:#b58bff;
    --teal:#43d9b8;
    --orange:#ff9a4d;
    --green:#5ee08c;
    --term-text:#8dffb2;
    --term-bg:#060907;
    --off:#232b33;
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    width:1000px;
    padding:36px;
    background:
      radial-gradient(circle at 20% 0%, rgba(90,209,230,0.05), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,180,84,0.04), transparent 45%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
      var(--bg);
    color:var(--text-primary);
  }
  .frame{
    max-width:928px;
    margin:0 auto;
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent 12%), var(--panel);
    padding:28px 30px 24px;
    position:relative;
    overflow:hidden;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--text-faint);
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    display:inline-block;
    margin-right:7px;
    box-shadow:0 0 6px 1px var(--green);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

  .headline{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:22px;
    gap:24px;
    min-height:72px;
  }
  .headline .stage-num{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:.08em;
    margin-bottom:4px;
  }
  .headline h1{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:30px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
    color:var(--text-primary);
    transition:opacity .25s ease;
  }
  .headline .sub{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13px;
    color:var(--text-dim);
    margin-top:6px;
    line-height:1.5;
  }
  .headline .sub span{display:block;}
  .status-chip{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    border:1px solid rgba(255,180,84,0.35);
    background:rgba(255,180,84,0.07);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
    transition:all .3s ease;
  }
  .status-chip.ready{
    color:var(--green);
    border-color:rgba(94,224,140,0.4);
    background:rgba(94,224,140,0.08);
  }

  .stepper{
    display:flex;
    align-items:center;
    margin-bottom:24px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
  }
  .step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex:1;
    position:relative;
  }
  .step .pip{
    width:9px;height:9px;border-radius:50%;
    background:var(--off);
    border:1px solid var(--panel-border);
    transition:all .35s ease;
  }
  .step .lbl{
    font-size:9.5px;
    letter-spacing:.05em;
    color:var(--text-faint);
    text-align:center;
    transition:color .35s ease;
    white-space:nowrap;
  }
  .step.done .pip{background:#4f6b5c; border-color:#4f6b5c;}
  .step.done .lbl{color:#4f6b5c;}
  .step.active .pip{
    background:var(--amber);
    border-color:var(--amber);
    box-shadow:0 0 8px 2px rgba(255,180,84,0.55);
    animation:activePip 1s ease-in-out infinite;
  }
  .step.active .lbl{color:var(--amber); font-weight:600;}
  @keyframes activePip{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
  .chevron{
    flex:0 0 auto;
    width:20px;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    margin-top:-16px;
    opacity:.6;
  }
  .chevron.on{color:var(--amber); opacity:1;}

  .stage{
    display:grid;
    grid-template-columns:1.32fr 1fr;
    gap:20px;
  }
  .board-wrap{
    background:#080b10;
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:10px;
  }

  .term{
    background:var(--term-bg);
    border:1px solid var(--panel-border);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    background:#0b0f0c;
    border-bottom:1px solid var(--panel-border);
  }
  .term-bar .tl{width:9px;height:9px;border-radius:50%;}
  .tl.r{background:#ff5f57;}
  .tl.y{background:#febc2e;}
  .tl.g{background:#28c840;}
  .term-bar .ttitle{
    margin-left:8px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
  .term-body{
    flex:1;
    padding:12px 14px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12.5px;
    line-height:1.9;
    color:var(--term-text);
    min-height:300px;
    max-height:300px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-shadow:0 0 6px rgba(141,255,178,0.25);
  }
  .term-line{
    white-space:pre;
    opacity:0;
    animation:lineIn .25s ease forwards;
  }
  @keyframes lineIn{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}
  .cursor{
    display:inline-block;
    width:7px;height:13px;
    background:var(--term-text);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}

  footer.note{
    margin-top:16px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:10.5px;
    color:var(--text-faint);
    text-align:center;
    letter-spacing:.04em;
  }

  .flicker-overlay{
    position:absolute; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:5;
    border-radius:16px;
  }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<div class="frame" id="frame">
  <div class="flicker-overlay" id="flicker"></div>

  <div class="eyebrow">
    <span><span class="dot"></span>DEV-BOARD-01 &nbsp;/&nbsp; SoC: ARM Cortex-A &nbsp;/&nbsp; embedded linux boot trace</span>
    <span id="clock">t+0.00s</span>
  </div>

  <div class="headline">
    <div>
      <div class="stage-num" id="stageNum">STAGE 1 / 7</div>
      <h1 id="stageTitle">POWER ON</h1>
      <div class="sub" id="stageSub"><span>Embedded board receiving power</span></div>
    </div>
    <div class="status-chip" id="statusChip">BOOTING</div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="stage">
    <div class="board-wrap">
      <svg viewBox="0 0 620 400" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="ledGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="4.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="wireGlow" x="-60%" y="-200%" width="220%" height="500%">
            <feGaussianBlur stdDeviation="2.2" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <rect x="6" y="6" width="608" height="388" rx="14" fill="#0d1117" stroke="#1e2731" stroke-width="1.5"/>
        <text x="20" y="386" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#3a4149" letter-spacing="1">REV C &#183; EMB-LNX-BOOT-DEMO &#183; power-flow trace</text>

        <g id="pwricon">
          <rect x="10" y="76" width="30" height="32" rx="3" fill="#0d1117" stroke="#3a4149" stroke-width="1.2"/>
          <path d="M28 82 L20 92 L26 92 L22 100 L33 88 L27 88 Z" fill="#5a6470"/>
          <text x="25" y="118" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#4a5560">5V IN</text>
        </g>

        <g id="wires" fill="none" stroke-width="2.4"></g>
        <circle id="pulse" r="5.5" fill="#ffffff" filter="url(#ledGlow)" style="display:none;"/>
        <g id="blocks"></g>
      </svg>
    </div>

    <div class="term">
      <div class="term-bar">
        <div class="tl r"></div><div class="tl y"></div><div class="tl g"></div>
        <div class="ttitle">ttyUSB0 &#183; 115200 8N1</div>
      </div>
      <div class="term-body" id="termBody"></div>
    </div>
  </div>

  <footer class="note">POWER ON &rarr; U-BOOT &rarr; LINUX KERNEL &rarr; ROOT FILESYSTEM &rarr; PERIPHERALS &rarr; LOGIN &rarr; SYSTEM READY &nbsp;&#183;&nbsp; loops automatically</footer>
</div>

<script>
const LED_COLORS = ['#ffb454','#5ad1e6','#6c93ff','#b58bff','#43d9b8','#ff9a4d','#5ee08c'];
const BLOCK_LABELS = ['POWER','U-BOOT','KERNEL','ROOTFS','PERIPH','INIT','READY'];
const STEP_LABELS = ['POWER','U-BOOT','KERNEL','ROOTFS','PERIPH','INIT','READY'];

const blockDefs = [
  {x:55,  y:60,  w:100, h:64},
  {x:200, y:60,  w:100, h:64},
  {x:345, y:60,  w:100, h:64},
  {x:490, y:60,  w:100, h:64},
  {x:490, y:230, w:100, h:64},
  {x:345, y:230, w:100, h:64},
  {x:160, y:222, w:150, h:80}
];

function portRight(b){ return {x:b.x+b.w, y:b.y+b.h/2}; }
function portLeft(b){ return {x:b.x, y:b.y+b.h/2}; }
function portTop(b){ return {x:b.x+b.w/2, y:b.y}; }
function portBottom(b){ return {x:b.x+b.w/2, y:b.y+b.h}; }

const connectors = [
  {x1:40, y1:92, x2:blockDefs[0].x, y2:92},
  {x1:portRight(blockDefs[0]).x, y1:92, x2:portLeft(blockDefs[1]).x, y2:92},
  {x1:portRight(blockDefs[1]).x, y1:92, x2:portLeft(blockDefs[2]).x, y2:92},
  {x1:portRight(blockDefs[2]).x, y1:92, x2:portLeft(blockDefs[3]).x, y2:92},
  {x1:portBottom(blockDefs[3]).x, y1:portBottom(blockDefs[3]).y, x2:portTop(blockDefs[4]).x, y2:portTop(blockDefs[4]).y},
  {x1:portLeft(blockDefs[4]).x, y1:262, x2:portRight(blockDefs[5]).x, y2:262},
  {x1:portLeft(blockDefs[5]).x, y1:262, x2:portRight(blockDefs[6]).x, y2:262}
];

const wiresGroup = document.getElementById('wires');
const blocksGroup = document.getElementById('blocks');
const svgNS = 'http://www.w3.org/2000/svg';

connectors.forEach((c,i)=>{
  const p = document.createElementNS(svgNS,'path');
  p.setAttribute('id','conn-'+i);
  p.setAttribute('d','M '+c.x1+' '+c.y1+' L '+c.x2+' '+c.y2);
  p.setAttribute('stroke','#3a4149');
  p.setAttribute('stroke-dasharray','4 4');
  p.setAttribute('stroke-linecap','round');
  wiresGroup.appendChild(p);
});

blockDefs.forEach((b,i)=>{
  const g = document.createElementNS(svgNS,'g');
  g.setAttribute('id','blockg-'+i);

  const rect = document.createElementNS(svgNS,'rect');
  rect.setAttribute('id','blockrect-'+i);
  rect.setAttribute('x',b.x); rect.setAttribute('y',b.y);
  rect.setAttribute('width',b.w); rect.setAttribute('height',b.h);
  rect.setAttribute('rx',7);
  rect.setAttribute('fill','#0d1117');
  rect.setAttribute('stroke','#2a323c');
  rect.setAttribute('stroke-width','1.3');
  g.appendChild(rect);

  const badge = document.createElementNS(svgNS,'text');
  badge.setAttribute('x',b.x+10); badge.setAttribute('y',b.y+17);
  badge.setAttribute('font-family','IBM Plex Mono, monospace');
  badge.setAttribute('font-size','8'); badge.setAttribute('fill','#4a5560');
  badge.textContent = (i+1)+'/7';
  g.appendChild(badge);

  const led = document.createElementNS(svgNS,'circle');
  led.setAttribute('id','blockled-'+i);
  led.setAttribute('cx', b.x+b.w-14); led.setAttribute('cy', b.y+14); led.setAttribute('r',5.5);
  led.setAttribute('fill','#232b33');
  g.appendChild(led);

  const label = document.createElementNS(svgNS,'text');
  label.setAttribute('id','blocklabel-'+i);
  label.setAttribute('x', b.x+b.w/2); label.setAttribute('y', b.y+b.h/2+8);
  label.setAttribute('text-anchor','middle');
  label.setAttribute('font-family','IBM Plex Mono, monospace');
  label.setAttribute('font-size', i===6 ? '15' : '12');
  label.setAttribute('font-weight','600');
  label.setAttribute('fill','#8a95a1');
  label.textContent = BLOCK_LABELS[i];
  g.appendChild(label);

  blocksGroup.appendChild(g);
});

STEP_LABELS.forEach((lbl,i)=>{
  const stepperEl = document.getElementById('stepper');
  if(i>0){
    const chev = document.createElement('div');
    chev.className = 'chevron';
    chev.id = 'chev-'+i;
    chev.textContent = '\u203A';
    stepperEl.appendChild(chev);
  }
  const s = document.createElement('div');
  s.className = 'step';
  s.id = 'step-'+i;
  s.innerHTML = '<div class="pip"></div><div class="lbl">'+lbl+'</div>';
  stepperEl.appendChild(s);
});

const stages = [
  {title:'POWER ON', sub:['Embedded board receiving power'], chip:'BOOTING',
   term:['$ power-on-sequence','PMIC: rails stable ... OK','SoC: reset released'], duration:5000},
  {title:'U-BOOT', sub:['Initializing hardware...','Loading kernel...'], chip:'BOOTING',
   term:['U-Boot 2024.01 (Aug 18 2026)','Initializing hardware...','Loading kernel...'], duration:5000},
  {title:'LINUX KERNEL', sub:['Kernel initialization','CPU / Memory / Scheduler'], chip:'BOOTING',
   term:['Starting kernel...','Linux version 6.6.0 (armv8)','CPU: ARM Cortex-A, 4 cores','Memory: 512MB available'], duration:5000},
  {title:'ROOT FILESYSTEM', sub:['Mounting /','/bin /etc /lib /usr'], chip:'BOOTING',
   term:['VFS: mounting root (ext4)','mounted / read-write','/bin /etc /lib /usr ready'], duration:5000},
  {title:'Initializing Peripherals', sub:['UART &#183; GPIO &#183; I2C &#183; SPI &#183; USB &#183; Ethernet'], chip:'BOOTING',
   term:['Initializing Peripherals','UART0 ......... OK','GPIO ........... OK','I2C-1 .......... OK','SPI0 ........... OK','USB ............ OK','eth0: link up'], duration:5000},
  {title:'LOGIN / INIT', sub:['init/systemd','Starting services...'], chip:'BOOTING',
   term:['Starting systemd...','Starting services...','Reached target Multi-User System','Login prompt ready'], duration:5000},
  {title:'SYSTEM READY', sub:['Linux Boot Complete'], chip:'READY',
   term:['Embedded Linux','','login: _','','SYSTEM READY &mdash; Linux Boot Complete'], duration:5000}
];

const HOLD_MS = 3400;
const stageNumEl = document.getElementById('stageNum');
const stageTitleEl = document.getElementById('stageTitle');
const stageSubEl = document.getElementById('stageSub');
const statusChip = document.getElementById('statusChip');
const termBody = document.getElementById('termBody');
const clockEl = document.getElementById('clock');
const flicker = document.getElementById('flicker');
const pulseEl = document.getElementById('pulse');

let termLines = [];
let clockStart = performance.now();
setInterval(()=>{
  const t = ((performance.now()-clockStart)/1000).toFixed(2);
  clockEl.textContent = 't+' + t + 's';
}, 80);

function renderTerm(){
  const trimmed = termLines.slice(-11);
  termBody.innerHTML = trimmed.map(l=>{
    if(l==='') return '<div class="term-line">&nbsp;</div>';
    return '<div class="term-line">'+l+'</div>';
  }).join('') + '<div class="term-line"><span class="cursor"></span></div>';
  termBody.scrollTop = termBody.scrollHeight;
}
function pushLine(txt){ termLines.push(txt); renderTerm(); }

function setStepper(idx){
  for(let i=0;i<7;i++){
    const s = document.getElementById('step-'+i);
    s.classList.remove('active','done');
    if(i<idx) s.classList.add('done');
    if(i===idx) s.classList.add('active');
    const chev = document.getElementById('chev-'+i);
    if(chev) chev.classList.toggle('on', i<=idx);
  }
}

function glowBlock(i, on){
  const rect = document.getElementById('blockrect-'+i);
  const led = document.getElementById('blockled-'+i);
  const label = document.getElementById('blocklabel-'+i);
  const color = LED_COLORS[i];
  if(on){
    rect.setAttribute('stroke', color);
    rect.setAttribute('stroke-width','2');
    rect.setAttribute('filter','url(#wireGlow)');
    led.setAttribute('fill', color);
    led.setAttribute('filter','url(#ledGlow)');
    label.setAttribute('fill', '#e7edf2');
  } else {
    rect.setAttribute('stroke','#2a323c');
    rect.setAttribute('stroke-width','1.3');
    rect.removeAttribute('filter');
    led.setAttribute('fill','#232b33');
    led.removeAttribute('filter');
    label.setAttribute('fill','#8a95a1');
  }
}

function resetBoard(){
  for(let i=0;i<7;i++) glowBlock(i,false);
  connectors.forEach((c,i)=>{
    const p = document.getElementById('conn-'+i);
    p.setAttribute('stroke','#3a4149');
    p.setAttribute('stroke-dasharray','4 4');
    p.removeAttribute('filter');
  });
  pulseEl.style.display = 'none';
  termLines = [];
  renderTerm();
}

function flowInto(idx, onArrive){
  const c = connectors[idx];
  const path = document.getElementById('conn-'+idx);
  const color = LED_COLORS[idx];
  path.setAttribute('stroke-dasharray','none');
  path.setAttribute('stroke', color);
  path.setAttribute('filter','url(#wireGlow)');
  pulseEl.style.display = 'block';
  pulseEl.setAttribute('fill', color);
  const dur = 620;
  const start = performance.now();
  function step(now){
    const t = Math.min(1, (now-start)/dur);
    const ease = t<0.5 ? 2*t*t : -1+(4-2*t)*t;
    const x = c.x1 + (c.x2-c.x1)*ease;
    const y = c.y1 + (c.y2-c.y1)*ease;
    pulseEl.setAttribute('cx', x);
    pulseEl.setAttribute('cy', y);
    if(t < 1){
      requestAnimationFrame(step);
    } else {
      pulseEl.style.display = 'none';
      if(onArrive) onArrive();
    }
  }
  requestAnimationFrame(step);
}

let timers = [];
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers = []; }

function runStage(idx){
  clearTimers();
  const s = stages[idx];
  setStepper(idx);

  flowInto(idx, ()=>{ glowBlock(idx, true); });

  stageNumEl.textContent = 'STAGE ' + (idx+1) + ' / 7';
  stageTitleEl.style.opacity = 0;
  timers.push(setTimeout(()=>{
    stageTitleEl.textContent = s.title;
    stageSubEl.innerHTML = s.sub.map(x=>'<span>'+x+'</span>').join('');
    stageTitleEl.style.opacity = 1;
  },120));

  statusChip.textContent = s.chip;
  statusChip.classList.toggle('ready', s.chip==='READY');

  s.term.forEach((line, i)=>{
    timers.push(setTimeout(()=>pushLine(line), 500 + i*280));
  });

  timers.push(setTimeout(()=>{
    if(idx < stages.length-1){
      runStage(idx+1);
    } else {
      timers.push(setTimeout(restartLoop, HOLD_MS));
    }
  }, s.duration));
}

function restartLoop(){
  flicker.style.transition = 'opacity .08s ease';
  flicker.style.opacity = '0.9';
  setTimeout(()=>{
    flicker.style.opacity = '0';
    resetBoard();
    clockStart = performance.now();
    runStage(0);
  }, 140);
}

resetBoard();
setStepper(-1);
runStage(0);
</script>
</body>
</html>
