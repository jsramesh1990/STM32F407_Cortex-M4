<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embedded Linux Boot Sequence</title>
<style>
  :root{
    --bg:#0a0d12;
    --bg-grid:#0d1219;
    --panel:#10151d;
    --panel-border:#1e2731;
    --board:#153228;
    --board-dark:#0d2019;
    --board-edge:#092017;
    --copper:#c88a52;
    --copper-dim:#5a4530;
    --silk:#bcd9c8;
    --silk-dim:#4f6b5c;
    --text-primary:#e7edf2;
    --text-dim:#7c8896;
    --text-faint:#4a5560;
    --amber:#ffb454;
    --cyan:#5ad1e6;
    --blue:#6c93ff;
    --violet:#b58bff;
    --teal:#43d9b8;
    --orange:#ff9a4d;
    --green:#5ee08c;
    --term-text:#8dffb2;
    --term-bg:#060907;
    --off:#232b33;
    font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  body{
    width:1000px;
    padding:36px;
    background:
      radial-gradient(circle at 20% 0%, rgba(90,209,230,0.05), transparent 45%),
      radial-gradient(circle at 85% 100%, rgba(255,180,84,0.04), transparent 45%),
      repeating-linear-gradient(0deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
      repeating-linear-gradient(90deg, var(--bg-grid) 0px, var(--bg-grid) 1px, transparent 1px, transparent 28px),
      var(--bg);
    color:var(--text-primary);
  }
  .frame{
    max-width:928px;
    margin:0 auto;
    border:1px solid var(--panel-border);
    border-radius:16px;
    background:linear-gradient(180deg, rgba(255,255,255,0.015), transparent 12%), var(--panel);
    padding:28px 30px 24px;
    position:relative;
    overflow:hidden;
  }
  .frame::before{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 40%, rgba(255,255,255,0.02) 50%, transparent 60%);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.16em;
    color:var(--text-faint);
    text-transform:uppercase;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:14px;
  }
  .eyebrow .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    display:inline-block;
    margin-right:7px;
    box-shadow:0 0 6px 1px var(--green);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}

  .headline{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    margin-bottom:22px;
    gap:24px;
    min-height:72px;
  }
  .headline .stage-num{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:.08em;
    margin-bottom:4px;
  }
  .headline h1{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:30px;
    font-weight:600;
    margin:0;
    letter-spacing:.01em;
    color:var(--text-primary);
    transition:opacity .25s ease;
  }
  .headline .sub{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13px;
    color:var(--text-dim);
    margin-top:6px;
    line-height:1.5;
  }
  .headline .sub span{display:block;}
  .status-chip{
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    letter-spacing:.08em;
    color:var(--amber);
    border:1px solid rgba(255,180,84,0.35);
    background:rgba(255,180,84,0.07);
    padding:6px 12px;
    border-radius:20px;
    white-space:nowrap;
    transition:all .3s ease;
  }
  .status-chip.ready{
    color:var(--green);
    border-color:rgba(94,224,140,0.4);
    background:rgba(94,224,140,0.08);
  }

  /* stepper */
  .stepper{
    display:flex;
    align-items:center;
    margin-bottom:24px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
  }
  .step{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    flex:1;
    position:relative;
  }
  .step .pip{
    width:9px;height:9px;border-radius:50%;
    background:var(--off);
    border:1px solid var(--panel-border);
    transition:all .35s ease;
  }
  .step .lbl{
    font-size:9.5px;
    letter-spacing:.05em;
    color:var(--text-faint);
    text-align:center;
    transition:color .35s ease;
    white-space:nowrap;
  }
  .step.done .pip{background:var(--silk-dim); border-color:var(--silk-dim);}
  .step.done .lbl{color:var(--silk-dim);}
  .step.active .pip{
    background:var(--amber);
    border-color:var(--amber);
    box-shadow:0 0 8px 2px rgba(255,180,84,0.55);
    animation:activePip 1s ease-in-out infinite;
  }
  .step.active .lbl{color:var(--amber); font-weight:600;}
  @keyframes activePip{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
  .chevron{
    flex:0 0 auto;
    width:20px;
    text-align:center;
    color:var(--text-faint);
    font-size:12px;
    margin-top:-16px;
    opacity:.6;
  }
  .chevron.on{color:var(--amber); opacity:1;}

  /* main grid: board + terminal */
  .stage{
    display:grid;
    grid-template-columns:1.32fr 1fr;
    gap:20px;
  }
  .board-wrap{
    background:var(--board-edge);
    border:1px solid var(--panel-border);
    border-radius:12px;
    padding:10px;
  }

  /* terminal */
  .term{
    background:var(--term-bg);
    border:1px solid var(--panel-border);
    border-radius:12px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:9px 12px;
    background:#0b0f0c;
    border-bottom:1px solid var(--panel-border);
  }
  .term-bar .tl{width:9px;height:9px;border-radius:50%;}
  .tl.r{background:#ff5f57;}
  .tl.y{background:#febc2e;}
  .tl.g{background:#28c840;}
  .term-bar .ttitle{
    margin-left:8px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:.03em;
  }
  .term-body{
    flex:1;
    padding:12px 14px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:12.5px;
    line-height:1.9;
    color:var(--term-text);
    min-height:300px;
    max-height:300px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    text-shadow:0 0 6px rgba(141,255,178,0.25);
  }
  .term-line{
    white-space:pre;
    opacity:0;
    animation:lineIn .25s ease forwards;
  }
  .term-line .prompt{color:var(--text-faint);}
  @keyframes lineIn{from{opacity:0; transform:translateY(3px);} to{opacity:1; transform:translateY(0);}}
  .cursor{
    display:inline-block;
    width:7px;height:13px;
    background:var(--term-text);
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{0%,50%{opacity:1;}51%,100%{opacity:0;}}

  footer.note{
    margin-top:16px;
    font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:10.5px;
    color:var(--text-faint);
    text-align:center;
    letter-spacing:.04em;
  }

  .flicker-overlay{
    position:absolute; inset:0;
    background:#000;
    opacity:0;
    pointer-events:none;
    z-index:5;
    border-radius:16px;
  }
</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<div class="frame" id="frame">

  <div class="eyebrow">
    <span><span class="dot"></span>DEV-BOARD-01 &nbsp;/&nbsp; SoC: ARM Cortex-A &nbsp;/&nbsp; embedded linux boot trace</span>
    <span id="clock">t+0.00s</span>
  </div>

  <div class="headline">
    <div>
      <div class="stage-num" id="stageNum">STAGE 1 / 7</div>
      <h1 id="stageTitle">POWER ON</h1>
      <div class="sub" id="stageSub"><span>Embedded board receiving power</span></div>
    </div>
    <div class="status-chip" id="statusChip">BOOTING</div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div class="stage">
    <div class="board-wrap">
      <svg viewBox="0 0 620 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <filter id="ledGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="4.2" result="blur"/>

          </filter>

            <feGaussianBlur stdDeviation="2.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <rect x="14" y="14" width="592" height="392" rx="16" fill="#12291f" stroke="#0a1a13" stroke-width="2"/>
        <rect x="14" y="14" width="592" height="392" rx="16" fill="none" stroke="#2b5a44" stroke-width="1" opacity="0.5"/>

        <circle cx="40" cy="40" r="8" fill="#0a1a13" stroke="#3a6b52" stroke-width="1.5"/>
        <circle cx="580" cy="40" r="8" fill="#0a1a13" stroke="#3a6b52" stroke-width="1.5"/>
        <circle cx="40" cy="380" r="8" fill="#0a1a13" stroke="#3a6b52" stroke-width="1.5"/>
        <circle cx="580" cy="380" r="8" fill="#0a1a13" stroke="#3a6b52" stroke-width="1.5"/>

        <text x="34" y="405" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#3a6b52" letter-spacing="1">REV C · EMB-LNX-BOOT-DEMO</text>

        <g id="traces" stroke="#2b5a44" stroke-width="1.4" fill="none" opacity="0.55"></g>

        <g id="ledGroup"></g>

        <g id="socGroup">
          <rect x="245" y="168" width="130" height="96" rx="5" fill="#04100b" stroke="#2b5a44" stroke-width="1.2"/>
          <rect id="socPulse" x="245" y="168" width="130" height="96" rx="5" fill="none" stroke="var(--cyan)" stroke-width="0" opacity="0"/>
          <text x="310" y="208" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" font-weight="600" fill="#cfe8da">SoC</text>
          <text x="310" y="224" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#5f8a72">ARM Cortex-A</text>
          <text id="socActivity" x="310" y="244" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="#3a6b52"></text>
          <g id="socPins" stroke="#5f8a72" stroke-width="1.4"></g>
        </g>

        <g id="ramGroup">
          <rect x="90" y="182" width="100" height="46" rx="4" fill="#04100b" stroke="#2b5a44" stroke-width="1"/>
          <text x="140" y="202" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#cfe8da" font-weight="600">DDR RAM</text>
          <text x="140" y="215" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#5f8a72">512MB</text>
        </g>

        <g id="flashGroup">
          <rect x="90" y="238" width="100" height="46" rx="4" fill="#04100b" stroke="#2b5a44" stroke-width="1"/>
          <text x="140" y="258" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="#cfe8da" font-weight="600">eMMC</text>
          <text x="140" y="271" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="7.5" fill="#5f8a72">rootfs</text>
        </g>

        <g id="periphGroup">
          <text x="428" y="192" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#5f8a72" letter-spacing=".5">PERIPHERALS</text>

          <g id="p-uart">
            <rect x="425" y="200" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="451" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">UART</text>
          </g>
          <g id="p-gpio">
            <rect x="486" y="200" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="512" y="218" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">GPIO</text>
          </g>
          <g id="p-i2c">
            <rect x="425" y="236" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="451" y="254" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">I2C</text>
          </g>
          <g id="p-spi">
            <rect x="486" y="236" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="512" y="254" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">SPI</text>
          </g>
          <g id="p-usb">
            <rect x="425" y="272" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="451" y="290" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">USB</text>
          </g>
          <g id="p-eth">
            <rect x="486" y="272" width="52" height="28" rx="3" fill="#04100b" stroke="#2b5a44"/>
            <text x="512" y="290" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#cfe8da">ETH</text>
          </g>
        </g>

        <g id="pwrGroup">
          <text x="72" y="330" font-family="IBM Plex Mono, monospace" font-size="8.5" fill="#5f8a72">PWR IN</text>
          <rect x="60" y="336" width="26" height="14" rx="2" fill="#04100b" stroke="#2b5a44"/>
          <path id="pwrBolt" d="M75 338 L69 345 L74 345 L71 350 L79 342 L74 342 Z" fill="#2b5a44"/>
        </g>

        <text x="310" y="330" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="#2b5a44" id="footNote">idle</text>
      </svg>
    </div>

    <div class="term">
      <div class="term-bar">
        <div class="tl r"></div><div class="tl y"></div><div class="tl g"></div>
        <div class="ttitle">ttyUSB0 · 115200 8N1</div>
      </div>
      <div class="term-body" id="termBody"></div>
    </div>
  </div>

  <footer class="note">POWER ON &rarr; U-BOOT &rarr; LINUX KERNEL &rarr; ROOT FILESYSTEM &rarr; PERIPHERALS &rarr; LOGIN &rarr; SYSTEM READY &nbsp;·&nbsp; loops automatically</footer>
</div>

<script>
const LED_COLORS = ['#ffb454','#5ad1e6','#6c93ff','#b58bff','#43d9b8','#ff9a4d','#5ee08c'];
const LED_NAMES  = ['PWR','U-BOOT','KRNL','RFS','PERIPH','INIT','RDY'];
const STEP_LABELS = ['POWER','U-BOOT','KERNEL','ROOTFS','PERIPH','INIT','READY'];

const stages = [
  {
    title:'POWER ON',
    sub:['Embedded board receiving power'],
    led:1, chip:'BOOTING',
    term:['$ power-on-sequence','PMIC: rails stable ... OK','SoC: reset released'],
    duration:2200, foot:'power applied'
  },
  {
    title:'U-BOOT',
    sub:['Initializing hardware...','Loading kernel...'],
    led:2, chip:'BOOTING',
    term:['U-Boot 2024.01 (Aug 18 2026)','Initializing hardware...','Loading kernel...'],
    duration:2300, foot:'bootloader active'
  },
  {
    title:'LINUX KERNEL',
    sub:['Kernel initialization','CPU / Memory / Scheduler'],
    led:3, chip:'BOOTING', socActive:true, ramActive:true,
    term:['Starting kernel...','Linux version 6.6.0 (armv8)','CPU: ARM Cortex-A, 4 cores','Memory: 512MB available'],
    duration:2400, foot:'kernel decompressing'
  },
  {
    title:'ROOT FILESYSTEM',
    sub:['Mounting /','/bin /etc /lib /usr'],
    led:4, chip:'BOOTING', flashActive:true,
    term:['VFS: mounting root (ext4)','mounted / read-write','/bin /etc /lib /usr ready'],
    duration:2200, foot:'mounting rootfs'
  },
  {
    title:'Initializing Peripherals',
    sub:['UART · GPIO · I2C · SPI · USB · Ethernet'],
    led:5, chip:'BOOTING', periph:true,
    term:['Initializing Peripherals','UART0 ......... OK','GPIO ........... OK','I2C-1 .......... OK','SPI0 ........... OK','USB ............ OK','eth0: link up'],
    duration:2800, foot:'probing peripherals'
  },
  {
    title:'LOGIN / INIT',
    sub:['init/systemd','Starting services...'],
    led:6, chip:'BOOTING',
    term:['Starting systemd...','Starting services...','Reached target Multi-User System','Login prompt ready'],
    duration:2200, foot:'starting userspace'
  },
  {
    title:'SYSTEM READY',
    sub:['Linux Boot Complete'],
    led:7, chip:'READY', allOn:true,
    term:['Embedded Linux','','login: _','','SYSTEM READY — Linux Boot Complete'],
    duration:2200, foot:'system ready'
  }
];

const HOLD_MS = 3400;
const ledGroup = document.getElementById('ledGroup');
const tracesGroup = document.getElementById('traces');
const socPins = document.getElementById('socPins');
const stepperEl = document.getElementById('stepper');

const ledX = i => 90 + i*72;
const ledY = 60;

for(let i=0;i<7;i++){
  const x = ledX(i);
  const stub = document.createElementNS('http://www.w3.org/2000/svg','line');
  stub.setAttribute('x1', x); stub.setAttribute('y1', ledY+11);
  stub.setAttribute('x2', x); stub.setAttribute('y2', ledY+34);
  stub.setAttribute('id', 'trace-'+i);
  stub.setAttribute('stroke', '#2b5a44');
  tracesGroup.appendChild(stub);

  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('id','ledwrap-'+i);

  const bezel = document.createElementNS('http://www.w3.org/2000/svg','circle');
  bezel.setAttribute('cx',x); bezel.setAttribute('cy',ledY); bezel.setAttribute('r',12);
  bezel.setAttribute('fill','#04100b'); bezel.setAttribute('stroke','#2b5a44'); bezel.setAttribute('stroke-width','1.4');
  g.appendChild(bezel);

  const led = document.createElementNS('http://www.w3.org/2000/svg','circle');
  led.setAttribute('cx',x); led.setAttribute('cy',ledY); led.setAttribute('r',7.5);
  led.setAttribute('fill','#232b33');
  led.setAttribute('id','led-'+i);
  g.appendChild(led);

  const num = document.createElementNS('http://www.w3.org/2000/svg','text');
  num.setAttribute('x',x); num.setAttribute('y',ledY+4);
  num.setAttribute('text-anchor','middle');
  num.setAttribute('font-family','IBM Plex Mono, monospace');
  num.setAttribute('font-size','7.5');
  num.setAttribute('font-weight','600');
  num.setAttribute('fill','#04100b');
  num.setAttribute('id','ledlabel-'+i);
  num.textContent = i+1;
  g.appendChild(num);

  const name = document.createElementNS('http://www.w3.org/2000/svg','text');
  name.setAttribute('x',x); name.setAttribute('y',ledY+46);
  name.setAttribute('text-anchor','middle');
  name.setAttribute('font-family','IBM Plex Mono, monospace');
  name.setAttribute('font-size','8');
  name.setAttribute('fill','#4f6b5c');
  name.setAttribute('id','ledname-'+i);
  name.textContent = LED_NAMES[i];
  g.appendChild(name);

  ledGroup.appendChild(g);
}

[[248,180],[248,196],[248,212],[248,228],[248,244]].forEach(p=>{
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',p[0]-8); l.setAttribute('y1',p[1]);
  l.setAttribute('x2',p[0]); l.setAttribute('y2',p[1]);
  socPins.appendChild(l);
});
[[372,180],[372,196],[372,212],[372,228],[372,244]].forEach(p=>{
  const l = document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',p[0]); l.setAttribute('y1',p[1]);
  l.setAttribute('x2',p[0]+8); l.setAttribute('y2',p[1]);
  socPins.appendChild(l);
});

STEP_LABELS.forEach((lbl,i)=>{
  if(i>0){
    const chev = document.createElement('div');
    chev.className = 'chevron';
    chev.id = 'chev-'+i;
    chev.textContent = '›';
    stepperEl.appendChild(chev);
  }
  const s = document.createElement('div');
  s.className = 'step';
  s.id = 'step-'+i;
  s.innerHTML = '<div class="pip"></div><div class="lbl">'+lbl+'</div>';
  stepperEl.appendChild(s);
});

const stageNumEl = document.getElementById('stageNum');
const stageTitleEl = document.getElementById('stageTitle');
const stageSubEl = document.getElementById('stageSub');
const statusChip = document.getElementById('statusChip');
const termBody = document.getElementById('termBody');
const socPulse = document.getElementById('socPulse');
const socActivity = document.getElementById('socActivity');
const footNote = document.getElementById('footNote');
const clockEl = document.getElementById('clock');
const flicker = document.getElementById('flicker');

const periphIds = ['p-uart','p-gpio','p-i2c','p-spi','p-usb','p-eth'];

let termLines = [];
let clockStart = performance.now();
let clockTimer = setInterval(()=>{
  const t = ((performance.now()-clockStart)/1000).toFixed(2);
  clockEl.textContent = 't+' + t + 's';
}, 80);

function renderTerm(){
  const trimmed = termLines.slice(-11);
  termBody.innerHTML = trimmed.map(l=>{
    if(l==='') return '<div class="term-line">&nbsp;</div>';
    return '<div class="term-line">'+l+'</div>';
  }).join('') + '<div class="term-line"><span class="cursor"></span></div>';
  termBody.scrollTop = termBody.scrollHeight;
}

function pushLine(txt){
  termLines.push(txt);
  renderTerm();
}

function setLed(i, on){
  const led = document.getElementById('led-'+i);
  const wrap = document.getElementById('ledwrap-'+i);
  const label = document.getElementById('ledlabel-'+i);
  const nameEl = document.getElementById('ledname-'+i);
  const trace = document.getElementById('trace-'+i);
  const color = LED_COLORS[i];
  if(on){
    led.setAttribute('fill', color);
    led.setAttribute('filter','url(#ledGlow)');
    label.setAttribute('fill','#04100b');
    nameEl.setAttribute('fill', color);
    trace.setAttribute('stroke', color);
    trace.setAttribute('stroke-width','2');
  } else {
    led.setAttribute('fill','#232b33');
    led.removeAttribute('filter');
    label.setAttribute('fill','#04100b');
    nameEl.setAttribute('fill','#4f6b5c');
    trace.setAttribute('stroke','#2b5a44');
    trace.setAttribute('stroke-width','1.4');
  }
}

function resetBoard(){
  for(let i=0;i<7;i++) setLed(i,false);
  socPulse.setAttribute('opacity','0');
  socPulse.setAttribute('stroke-width','0');
  socActivity.textContent = '';
  ['ramGroup','flashGroup'].forEach(id=>{
    document.getElementById(id).querySelectorAll('rect').forEach(r=>r.setAttribute('stroke','#2b5a44'));
  });
  periphIds.forEach(id=>{
    document.getElementById(id).querySelector('rect').setAttribute('stroke','#2b5a44');
  });
  termLines = [];
  renderTerm();
}

function setStepper(idx){
  for(let i=0;i<7;i++){
    const s = document.getElementById('step-'+i);
    s.classList.remove('active','done');
    if(i<idx) s.classList.add('done');
    if(i===idx) s.classList.add('active');
    const chev = document.getElementById('chev-'+i);
    if(chev) chev.classList.toggle('on', i<=idx);
  }
}

function highlightPeripherals(){
  let i = 0;
  const iv = setInterval(()=>{
    if(i>0) document.getElementById(periphIds[i-1]).querySelector('rect').setAttribute('stroke', LED_COLORS[4]);
    if(i>=periphIds.length){ clearInterval(iv); return; }
    document.getElementById(periphIds[i]).querySelector('rect').setAttribute('stroke','#ffffff');
    i++;
  }, 340);
}

let timers = [];
function clearTimers(){ timers.forEach(t=>clearTimeout(t)); timers = []; }

function runStage(idx){
  clearTimers();
  const s = stages[idx];
  setStepper(idx);
  setLed(s.led-1, true);

  stageNumEl.textContent = 'STAGE ' + (idx+1) + ' / 7';
  stageTitleEl.style.opacity = 0;
  timers.push(setTimeout(()=>{
    stageTitleEl.textContent = s.title;
    stageSubEl.innerHTML = s.sub.map(x=>'<span>'+x+'</span>').join('');
    stageTitleEl.style.opacity = 1;
  },120));

  statusChip.textContent = s.chip;
  statusChip.classList.toggle('ready', s.chip==='READY');
  footNote.textContent = s.foot;

  if(s.socActive){
    socPulse.setAttribute('stroke','#5ad1e6');
    socPulse.setAttribute('stroke-width','2');
    socPulse.setAttribute('opacity','0.9');
    socActivity.textContent = 'cpu0 cpu1 cpu2 cpu3 :: active';
  }
  if(s.ramActive){
    document.querySelectorAll('#ramGroup rect')[0].setAttribute('stroke', LED_COLORS[2]);
  }
  if(s.flashActive){
    document.querySelectorAll('#flashGroup rect')[0].setAttribute('stroke', LED_COLORS[3]);
  }
  if(s.periph){
    highlightPeripherals();
  }

  s.term.forEach((line, i)=>{
    timers.push(setTimeout(()=>pushLine(line), 260 + i*280));
  });

  timers.push(setTimeout(()=>{
    if(idx < stages.length-1){
      runStage(idx+1);
    } else {
      timers.push(setTimeout(restartLoop, HOLD_MS));
    }
  }, s.duration));
}

function restartLoop(){
  flicker.style.transition = 'opacity .08s ease';
  flicker.style.opacity = '0.9';
  setTimeout(()=>{
    flicker.style.opacity = '0';
    resetBoard();
    clockStart = performance.now();
    runStage(0);
  }, 140);
}

resetBoard();
setStepper(-1);
runStage(0);
</script>
</body>
</html>
